<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0b0b" />
<title>Track</title>
<style>
  :root{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:#0b0b0b;
    color:#f4f4f4;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:min(680px,100%);
    padding:calc(22px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
  }
  h1{font-size:24px;margin:0 0 28px;font-weight:700}
  .status{text-align:center;margin-top:34px}
  .label{
    font-size:14px;
    opacity:.55;
    text-transform:uppercase;
    letter-spacing:.12em;
  }
  .time{
    font-size:44px;
    font-variant-numeric:tabular-nums;
    margin:10px 0 4px;
    font-weight:650;
  }
  .since{opacity:.65;min-height:22px}
  button{
    width:100%;
    border:0;
    border-radius:20px;
    padding:20px 18px;
    font-size:22px;
    font-weight:700;
    margin-top:30px;
    background:#f2f2f2;
    color:#111;
  }
  button.stop{background:#ff5a52;color:white}
  .secondary{
    background:#1c1c1e;
    color:#f4f4f4;
    font-size:15px;
    padding:13px 14px;
    margin-top:10px;
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .note-card{
    margin-top:26px;
    background:#131313;
    border-radius:18px;
    padding:14px;
  }
  .note-card textarea{
    width:100%;
    border:0;
    outline:0;
    resize:vertical;
    min-height:76px;
    background:transparent;
    color:#f4f4f4;
    font:inherit;
    line-height:1.45;
  }
  .note-card textarea::placeholder{color:#777}
  .note-card button{
    margin-top:10px;
    padding:13px 14px;
    border-radius:14px;
    font-size:15px;
  }

  details{
    margin-top:24px;
    background:#101010;
    border-radius:16px;
    overflow:hidden;
  }
  summary{
    list-style:none;
    cursor:pointer;
    padding:15px 16px;
    font-size:16px;
    font-weight:650;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  summary::-webkit-details-marker{display:none}
  summary .count{opacity:.45;font-size:13px;font-weight:500}
  .details-body{padding:0 14px 14px}
  .session,.thought{
    background:#171717;
    border-radius:14px;
    padding:13px 14px;
    margin-top:10px;
  }
  .session-top,.thought-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:baseline;
  }
  .range,.thought-time{
    font-variant-numeric:tabular-nums;
    font-weight:600;
  }
  .dur{opacity:.6;font-size:14px}
  .date{font-size:13px;opacity:.45;margin-top:4px}
  .thought-text{
    margin-top:7px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .session textarea{
    width:100%;
    margin-top:10px;
    resize:vertical;
    min-height:44px;
    border:1px solid #2d2d2d;
    background:#0f0f0f;
    color:#f2f2f2;
    border-radius:10px;
    padding:10px;
    font:inherit;
  }
  .mini{
    width:auto;
    display:inline-block;
    padding:8px 10px;
    border-radius:10px;
    margin:8px 8px 0 0;
    font-size:13px;
    background:#252525;
    color:#ddd;
  }
  .empty{opacity:.45;font-size:14px;padding:8px 2px}
  .footer{opacity:.4;font-size:12px;margin-top:24px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Track</h1>

  <div class="status">
    <div class="label" id="statusLabel">READY</div>
    <div class="time" id="timer">00:00:00</div>
    <div class="since" id="since"></div>
  </div>

  <button id="mainBtn">START</button>

  <div class="note-card">
    <textarea id="thoughtInput" placeholder="碎碎念…"></textarea>
    <button class="secondary" id="thoughtBtn">Save thought</button>
  </div>

  <details>
    <summary>
      <span>Today’s thoughts</span>
      <span class="count" id="thoughtCount">0</span>
    </summary>
    <div class="details-body" id="thoughts"></div>
  </details>

  <details>
    <summary>
      <span>Today’s sessions</span>
      <span class="count" id="sessionCount">0</span>
    </summary>
    <div class="details-body" id="history"></div>
  </details>

  <div class="row">
    <button class="secondary" id="csvBtn">Export CSV</button>
    <button class="secondary" id="jsonBtn">Export JSON</button>
  </div>

  <button class="secondary" id="timelineBtn">Export Today Timeline</button>

  <div class="footer">
    Timer stays primary. Thoughts are timestamped automatically and can be added anytime.
    Data is stored in this browser on this device. Entries older than 5 days are removed
    automatically, so export before then.
  </div>
</div>

<script>
const KEY_SESSIONS = "track.sessions.v1";
const KEY_CURRENT  = "track.current.v1";
const KEY_THOUGHTS = "track.thoughts.v1";
const RETENTION_DAYS = 5;

const mainBtn = document.getElementById("mainBtn");
const timer = document.getElementById("timer");
const statusLabel = document.getElementById("statusLabel");
const since = document.getElementById("since");
const historyEl = document.getElementById("history");
const thoughtsEl = document.getElementById("thoughts");
const thoughtInput = document.getElementById("thoughtInput");
const thoughtCount = document.getElementById("thoughtCount");
const sessionCount = document.getElementById("sessionCount");

let tickHandle = null;

function loadJSON(key, fallback=[]){
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch { return fallback; }
}
function saveJSON(key, value){
  localStorage.setItem(key, JSON.stringify(value));
}
function loadSessions(){ return loadJSON(KEY_SESSIONS, []); }
function saveSessions(x){ saveJSON(KEY_SESSIONS, x); }
function loadThoughts(){ return loadJSON(KEY_THOUGHTS, []); }
function saveThoughts(x){ saveJSON(KEY_THOUGHTS, x); }

function getCurrent(){
  const v = localStorage.getItem(KEY_CURRENT);
  return v ? Number(v) : null;
}
function setCurrent(ms){
  if(ms === null) localStorage.removeItem(KEY_CURRENT);
  else localStorage.setItem(KEY_CURRENT, String(ms));
}
function pad(n){ return String(n).padStart(2,"0"); }
function duration(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  return `${pad(h)}:${pad(m)}:${pad(sec)}`;
}
function fmtTime(ms){
  return new Date(ms).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
function fmtDate(ms){
  return new Date(ms).toLocaleDateString([], {year:"numeric",month:"short",day:"numeric"});
}
function fmtISO(ms){ return new Date(ms).toISOString(); }
function dayKey(ms){
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function todayKey(){ return dayKey(Date.now()); }

/** Local midnight at the start of the oldest day we keep. */
function retentionCutoff(){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-(RETENTION_DAYS-1));
  return d.getTime();
}

/** Drop entries outside the retention window. Export before a day falls out; nothing else keeps it. */
function pruneOldEntries(){
  const cutoff = retentionCutoff();
  const sessions = loadSessions();
  const keptSessions = sessions.filter(s=>s.start>=cutoff);
  if(keptSessions.length !== sessions.length) saveSessions(keptSessions);
  const thoughts = loadThoughts();
  const keptThoughts = thoughts.filter(t=>t.time>=cutoff);
  if(keptThoughts.length !== thoughts.length) saveThoughts(keptThoughts);
}

function updateUI(){
  const start = getCurrent();
  if(start){
    statusLabel.textContent = "TRACKING";
    mainBtn.textContent = "STOP";
    mainBtn.classList.add("stop");
    since.textContent = `Started ${fmtTime(start)}`;
    const update = ()=> timer.textContent = duration(Date.now()-start);
    update();
    clearInterval(tickHandle);
    tickHandle = setInterval(update,1000);
  } else {
    statusLabel.textContent = "READY";
    mainBtn.textContent = "START";
    mainBtn.classList.remove("stop");
    since.textContent = "";
    timer.textContent = "00:00:00";
    clearInterval(tickHandle);
  }
  renderHistory();
  renderThoughts();
}

mainBtn.addEventListener("click", ()=>{
  const start = getCurrent();
  if(!start){
    setCurrent(Date.now());
  } else {
    const end = Date.now();
    const sessions = loadSessions();
    sessions.unshift({
      id: crypto.randomUUID ? crypto.randomUUID() : String(end),
      start,
      end,
      note:""
    });
    saveSessions(sessions);
    setCurrent(null);
  }
  updateUI();
});

document.getElementById("thoughtBtn").addEventListener("click", ()=>{
  const text = thoughtInput.value.trim();
  if(!text) return;
  const thoughts = loadThoughts();
  thoughts.unshift({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    time: Date.now(),
    text
  });
  saveThoughts(thoughts);
  thoughtInput.value = "";
  renderThoughts();
});

function renderThoughts(){
  const all = loadThoughts();
  const todays = all.filter(t=>dayKey(t.time)===todayKey());
  thoughtCount.textContent = `${todays.length} today`;
  thoughtsEl.innerHTML = "";
  if(!todays.length){
    thoughtsEl.innerHTML = `<div class="empty">No thoughts today.</div>`;
    return;
  }
  todays.forEach(t=>{
    const box = document.createElement("div");
    box.className = "thought";
    box.innerHTML = `
      <div class="thought-top">
        <div class="thought-time">${fmtTime(t.time)}</div>
        <div class="date">${fmtDate(t.time)}</div>
      </div>
      <div class="thought-text">${escapeHTML(t.text)}</div>
      <button class="mini delete-thought" data-id="${t.id}">Delete</button>
    `;
    thoughtsEl.appendChild(box);
  });
  document.querySelectorAll(".delete-thought").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      saveThoughts(loadThoughts().filter(x=>x.id!==btn.dataset.id));
      renderThoughts();
    });
  });
}

function renderHistory(){
  const todays = loadSessions().filter(s=>dayKey(s.start)===todayKey());
  sessionCount.textContent = `${todays.length} today`;
  historyEl.innerHTML = "";
  if(!todays.length){
    historyEl.innerHTML = `<div class="empty">No sessions today.</div>`;
    return;
  }
  todays.forEach(s=>{
    const box = document.createElement("div");
    box.className = "session";
    const mins = Math.round((s.end-s.start)/60000);
    box.innerHTML = `
      <div class="session-top">
        <div class="range">${fmtTime(s.start)}–${fmtTime(s.end)}</div>
        <div class="dur">${mins} min</div>
      </div>
      <div class="date">${fmtDate(s.start)}</div>
      <textarea placeholder="Optional note / what was this?" data-id="${s.id}">${escapeHTML(s.note||"")}</textarea>
      <button class="mini save-note" data-id="${s.id}">Save note</button>
      <button class="mini delete-session" data-id="${s.id}">Delete</button>
    `;
    historyEl.appendChild(box);
  });

  document.querySelectorAll(".save-note").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.id;
      const ta = document.querySelector(`textarea[data-id="${CSS.escape(id)}"]`);
      const sessions = loadSessions();
      const idx = sessions.findIndex(x=>x.id===id);
      if(idx>=0){
        sessions[idx].note = ta.value;
        saveSessions(sessions);
        btn.textContent = "Saved";
        setTimeout(()=>btn.textContent="Save note",900);
      }
    });
  });

  document.querySelectorAll(".delete-session").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      saveSessions(loadSessions().filter(x=>x.id!==btn.dataset.id));
      renderHistory();
    });
  });
}

function escapeHTML(str){
  return str.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function csvEscape(v){
  const x = String(v ?? "").replaceAll('"','""');
  return `"${x}"`;
}
function download(name, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

document.getElementById("jsonBtn").addEventListener("click", ()=>{
  const out = {
    exported_at: new Date().toISOString(),
    current_start: getCurrent() ? fmtISO(getCurrent()) : null,
    sessions: loadSessions().map(s=>({
      start: fmtISO(s.start),
      end: fmtISO(s.end),
      duration_seconds: Math.round((s.end-s.start)/1000),
      note: s.note || ""
    })),
    thoughts: loadThoughts().map(t=>({
      timestamp: fmtISO(t.time),
      text: t.text
    }))
  };
  download(`track-${todayKey()}.json`, JSON.stringify(out,null,2), "application/json");
});

document.getElementById("csvBtn").addEventListener("click", ()=>{
  const rows = [["type","start","end","duration_seconds","timestamp","text_or_note"]];
  loadSessions().slice().reverse().forEach(s=>{
    rows.push([
      "session", fmtISO(s.start), fmtISO(s.end),
      Math.round((s.end-s.start)/1000), "", s.note || ""
    ]);
  });
  loadThoughts().slice().reverse().forEach(t=>{
    rows.push(["thought","","","",fmtISO(t.time),t.text]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  download(`track-${todayKey()}.csv`, csv, "text/csv");
});

document.getElementById("timelineBtn").addEventListener("click", ()=>{
  const key = todayKey();
  const items = [];
  loadSessions().forEach(s=>{
    if(dayKey(s.start)===key){
      items.push({
        sort:s.start,
        line:`- ${fmtTime(s.start)}–${fmtTime(s.end)} · ${Math.round((s.end-s.start)/60000)} min${s.note ? ` · ${s.note}` : ""}`
      });
    }
  });
  loadThoughts().forEach(t=>{
    if(dayKey(t.time)===key){
      items.push({
        sort:t.time,
        line:`- ${fmtTime(t.time)} · 💭 ${t.text}`
      });
    }
  });
  items.sort((a,b)=>a.sort-b.sort);

  const md = `# ${key}\n\n## Timeline\n\n${items.length ? items.map(x=>x.line).join("\n") : "_No entries yet._"}\n`;
  download(`${key}-timeline.md`, md, "text/markdown");
});

pruneOldEntries();
updateUI();
</script>
</body>
</html>
